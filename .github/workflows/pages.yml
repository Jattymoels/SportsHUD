name: Test and deploy

# Every push runs the unit tests. A push to the default branch that passes
# them is then published to GitHub Pages.
#
# One-time setup: in the repository's Settings, open Pages and set
# "Build and deployment" > "Source" to "GitHub Actions".

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/configure-pages@v6
      - name: Collect the site
        # tools/site.mjs says what the site is made of, and lists it for offline use.
        run: node tools/site.mjs _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
